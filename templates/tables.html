<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    name="description"
    content="COPS - DataTables"
  />
  <title>COPS - {{=it.title}}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://cdn.datatables.net/3.0.4/css/dataTables.bootstrap5.min.css" rel="stylesheet" integrity="sha384-OZKa6QSlaaq/LGR1sBFkYhC0c/nacIFh1chsblhDUxggC9Zb0XLEEMs95i1Kydnt" crossorigin="anonymous">
  <script type="text/javascript" src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="https://cdn.datatables.net/3.0.4/js/dataTables.min.js" integrity="sha384-i3qKUispup6yO0B16Bvnk2AmVi8O60Qww2omjtD9NHi1ns1H4jiz2EhYBjLew/9C" crossorigin="anonymous"></script>
  <script src="https://cdn.datatables.net/3.0.4/js/dataTables.bootstrap5.min.js" integrity="sha384-4d8X9sr6Gnv9AgIQn6bv3lmQxj5fD+9bVAun0/XMmdy7oPRvT0adfiUUiiYpi4Ck" crossorigin="anonymous"></script>
  <script type="text/javascript" charset="utf-8">
		// Not supported for Javascript ES5
    const ajaxUrl = '{{=it.ajax_url}}';
    const table = '{{=it.table}}';
    const columns = {{=it.json_columns}};
    const foreignKeys = {{=it.foreign_keys}};
    const filterUrl = '{{=it.filter_url}}';

    $(document).ready(function() {
      const urlParams = new URLSearchParams(window.location.search);
      const searchValue = urlParams.get('search') || '';

      if (ajaxUrl && columns) {
        columns.forEach(function(col) {
            if (filterUrl && col.data == 'books') {
                col.render = function(data, type, row) {
                    if (type === 'display' && data) {
                        return '<a href="' + filterUrl + row.id + '&from=' + table + '.' + row.id + '">' + data + '</a>';
                    }
                    return data;
                };
            } else if (foreignKeys[col.data]) {
                col.render = function(data, type, row) {
                    if (type === 'display' && data) {
                        return '<a href="' + foreignKeys[col.data] + '?id=' + data + '&from=' + table + '.' + row.id + '">' + data + '</a>';
                    }
                    return data;
                };
            }
        });

        $('#example').DataTable({
          "processing": true,
          "serverSide": true,
          "search": {
            "search": searchValue
          },
          "ajax": {
            "url": ajaxUrl,
            "type": "POST",
            "data": function ( d ) {
                for (const [key, value] of urlParams) {
                    if (key !== 'search') d[key] = value;
                }
            },
            "beforeSend": function (xhr) {
              // You might need to send an API key if configured
              xhr.setRequestHeader('X-API-KEY', '{{=it.api_key}}');
            }
          },
          "columns": columns
        });
      } else {
        $('#example').DataTable();
      }

      $('body').on('click', '.clickable-row', function() {
        window.location = $(this).data("href");
      });
      $("<style type='text/css'> .clickable-row { cursor: pointer; } </style>").appendTo("head");
    } );
  </script>
</head>
<body>
  <div class="container">
    <nav style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
      <ol class="breadcrumb">
        {{=it.breadcrumb}}
      </ol>
    </nav>
    <table id="example" class="table table-striped table-bordered" style="width:100%">
      <thead>
        {{=it.thead}}
      </thead>
      <tbody>
        {{=it.tbody}}
      </tbody>
      <tfoot>
        {{=it.tfoot}}
      </tfoot>
    </table>
  </div>
</body>
</html>
